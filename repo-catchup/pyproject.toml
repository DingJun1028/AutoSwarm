[project]
name = "repo-catchup-worker"
version = "0.1.0"
description = "Managed-deployment worker for the repo-catchup workflow"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
